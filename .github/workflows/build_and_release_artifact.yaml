name: Build and release artifact tab-keeper-react-chrome-extension

on:
  push:
    tags:
      - 'v*'
  # Manual dry run. Lets the whole release path - build, remote-code prune,
  # and the verification that no remotely hosted URLs survive - be exercised
  # without cutting a tag. Nothing here publishes: the job only uploads an
  # artifact, so a dispatch run is side-effect free.
  workflow_dispatch:

jobs:
  build:
    name: Build and release artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Run tests
        run: npm run test

      - name: Get version from manifest
        id: version
        run: |
          echo "prop=$(node -p "require('./public/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate dist folder
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Prune unused remotely hosted Firebase JS SDK calls
        run: |
          # Firebase Auth carries script URLs for sign-in flows this extension
          # never uses (Google popup, phone/reCAPTCHA). Manifest V3 forbids
          # remotely hosted code, so blank them out. The trailing [^`"]* absorbs
          # any query string the SDK appends, which differs between versions.
          #
          # Every emitted chunk is scanned, not just the popup entry: the build
          # is code-split, and which chunk Firebase lands in is Rollup's choice.
          find ./dist -name '*.js' -print0 | xargs -0 sed -i \
            -e 's|https://apis\.google\.com/js/api\.js[^`"]*||g' \
            -e 's|https://www\.google\.com/recaptcha/[^`"]*||g'

      - name: Verify no remotely hosted code remains
        run: |
          if grep -rEo --include='*.js' \
            'https://(apis\.google\.com|www\.google\.com/recaptcha)[^`"]*' ./dist; then
            echo "::error::Remotely hosted script URLs survived the prune step above."
            echo "::error::A Firebase upgrade likely changed their shape. Update the sed patterns."
            exit 1
          fi
          echo "No remotely hosted script URLs remain in the bundle."

      - name: Upload release zip file ready for Chrome Web Store
        uses: actions/upload-artifact@v7
        with:
          # A dry run builds the same artifact but is not a release, so mark it
          # to keep it from being mistaken for the package that goes to the
          # Web Store. github.event_name is a trusted context value.
          name: tab-keeper-react-chrome-extension-v${{steps.version.outputs.prop}}${{ github.event_name == 'workflow_dispatch' && '-dryrun' || '' }}
          path: ./dist/
