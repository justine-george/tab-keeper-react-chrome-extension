name: Build before merge - tab-keeper-react-chrome-extension

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build before merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # `22` resolves to the newest 22.x, which is what ESLint 10 needs. Do not
      # pin a specific 22.x below 22.13 - eslint's engines field is
      # `^20.19.0 || ^22.13.0 || >=24` and npm will refuse to install below it.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      # Fails on lint errors only; `any` and exhaustive-deps are warnings and
      # are reported without blocking. Without this step the lint script was
      # never run by anything, so violations accumulated unnoticed.
      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      # e2e/ sits outside tsconfig's `include` and has its own project file, so
      # `npm run test` typechecks none of it -- and vitest does not typecheck at
      # all. Without this a spec can be broken in a way no other step sees.
      - name: Typecheck E2E specs
        run: npm run typecheck:e2e

      # `build:e2e`, not `build`: it chains the prune step, so CI now produces
      # the artifact that actually ships (the release workflow strips remotely
      # hosted Firebase URLs after building) and the suite below drives that
      # same pruned bundle rather than one no user ever receives.
      # NO Firebase env, deliberately (KAN-147). It used to need fake values
      # because an absent config threw during module init and left the popup
      # blank; the app now boots without a cloud and disables sync instead.
      #
      # So this step is also the regression test for that: if the crash ever
      # comes back, the E2E suite below goes red here rather than in a user's
      # popup. The real values stay where they belong, in the release workflow.
      - name: Generate dist folder
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `playwright test` directly rather than `npm run test:e2e`, which would
      # repeat the typecheck and the build above. That is safe ONLY because the
      # step immediately above builds dist and nothing between them touches it
      # -- run this locally without building first and it silently drives a
      # stale dist, which is how KAN-142's first bisect went wrong.
      - name: Run E2E tests
        run: npx playwright test

      # trace: 'retain-on-failure' produces nothing anyone can open unless the
      # traces leave the runner.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
